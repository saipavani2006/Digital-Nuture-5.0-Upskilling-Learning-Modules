<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1 class="text-primary">Welcome to bootstrap</h1>
    

<div class="d-flex justify-content-center bg-info align-items-center" style="height:200px;">
  <div>Centered Box</div>
</div>
<div class="row">
  <div class="col-md-6 order-md-2">First</div>
  <div class="col-md-6 order-md-1">Second</div>
</div>
<div class="d-flex flex-column flex-md-row bg-dark text-white p-3">
  <div class="me-auto">Logo</div>
  <div>Menu</div>
</div>
<h1 class="display-1">Big Heading</h1>
<p class="lead">Important text</p>
<p class="text-muted">Muted text</p>
<p class="fw-bold">Bold text</p>
<p class="text-uppercase">uppercase</p>
<p class="text-lowercase">LOWERCASE</p>
<p class="text-capitalize">capitalize text</p>



<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand" href="#">Logo</a>
</nav>
<div class="card" style="width: 18rem;">
  <img src="logo.jpg" width="100px" height="100px" class="card-img-top">
  <div class="card-body">
    <h5 class="card-title">Profile</h5>
  </div>
</div>
<div class="m-3 p-3 bg-success">Box</div>
<div class="bg-primary text-white p-3">Dashboard</div>
<div class="d-none d-mg-block">Visible on tablet+</div>
<img src="logo.jpg" radius="25px" class="rounded-circle border border-primary border-3">

<div class="shadow-lg p-3">Card</div>
<footer class="position-fixed bottom-0 bg-dark text-white w-100 text-center">
  Footer
</footer>
<i class="bi bi-facebook"></i>
<button data-bs-toggle="modal" data-bs-target="#myModal">Open</button>

<div class="modal" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content p-3">Hello Modal</div>
  </div>
</div>
<div class="accordion">
  <div class="accordion-item">
    <button class="accordion-button">Click</button>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script
</body>
</html>
